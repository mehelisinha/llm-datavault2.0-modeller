[pytest]
# Project-level pytest config scoped to the AI-layer tests under tests/.
# The legacy shared/tests/ suite has its own conftest and is run independently
# (see shared/tests/conftest.py), so it is excluded here to avoid coupling the
# AI work to unrelated import-path setup.
testpaths =
    tests
norecursedirs =
    shared
    poc
    output
    target
    .venv
    devops
    documentation
    docs_html
addopts =
    --strict-markers
    --rootdir=.
    -ra
markers =
    ai: AI-layer test
    live: requires live Azure credentials and incurs token cost (deselect by default)
filterwarnings =
    ignore::DeprecationWarning:azure.*
