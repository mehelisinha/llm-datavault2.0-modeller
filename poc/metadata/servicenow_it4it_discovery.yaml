# =============================================================================
# ServiceNow IT4IT — Discovery payload (source-side schema only)
# =============================================================================
# Phase 1 discovery shape (system + tables + columns), consumed by
# `discover_from_yaml()` and fed to the AI modelling agent in
# tests/ai/test_eval_models.py.
#
# Source: edh_unreg_consumption_dev.it4it_servicenow
# Schema dump: ../../../Downloads/it4it_servicenow_schema.pdf (9 tables,
#              299 columns total).
#
# CDC sidecar columns (__$start_lsn, __$end_lsn, __$seqval, __$operation,
# __$update_mask, __$command_id) are intentionally excluded — they are SQL
# Server change-tracking metadata, not business attributes.
# Audit columns (sys_created_on, sys_updated_on, sys_id, sys_mod_count,
# mirror_*) are kept as the modeller benefits from seeing them.
# =============================================================================

