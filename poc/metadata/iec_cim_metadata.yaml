# =============================================================================
# IEC61968 CIM Source System — DWA Metadata Configuration
# =============================================================================
# This file is the single source of truth for generating all dbt Data Vault 2.0
# models for the IEC61968 CIM source system (grid asset management domain).
#
# Schema:
#   system:        source system metadata (catalog, schema, record_source)
#   packages:      dbt package dependencies (generates packages.yml)
#   hubs:          hub entities with business key and hash key
#   satellites:    descriptive attribute groups per hub, with hashdiff and payload
#   links:         many-to-many relationships between hubs
#   eff_sats:      effectivity satellites tracking relationship lifecycle (CDC)
#   pit_tables:    point-in-time snapshot tables (business vault query assist)
#   bridge_tables: bridge tables pre-joining hubs/links (business vault query assist)
#   dim_tables:    dimension views exposing current state from hub + satellites
#   fact_tables:   fact views joining bridge + dimensions for reporting
#   bv_sats:       business vault satellites with derived / cleansed attributes
# =============================================================================

system:
  system_id: IEC_CIM_001
  system_name: IEC61968_CIM
  source_type: delta
  catalog: edh_unreg_silver_dev_st
  schema: bronze
  load_frequency: daily
  record_source: IEC61968_CIM_v2.0       # value stamped into the RECORD_SOURCE column
  record_source_column: RECORD_SOURCE    # staging column name referenced by raw-vault models
  default_ldts: LOAD_DATE               # load-date-timestamp column name

# ── dbt Packages ──────────────────────────────────────────────────────────────
packages:
  - package: dbt-labs/dbt_utils
    version: 1.3.3
  - package: metaplane/dbt_expectations
    version: 0.10.10
  - package: Datavault-UK/automate_dv
    version: 0.10.2
# ── Macros ────────────────────────────────────────────────────────────────────
macros:
  - name: generate_schema_name
    description: Generates the schema name by overwriting the AutomateDV default behavior.
# ── Hubs ──────────────────────────────────────────────────────────────────────
hubs:
  - name: hub_conducting_equipment
    source_table: conducting_equipment          # bronze table name
    staging_model: stg_conducting_equipment
    business_key: mrid
    hash_key: HK_CONDUCTING_EQUIPMENT

  - name: hub_connectivity_node
    source_table: connectivity_nodes
    staging_model: stg_connectivity_nodes
    business_key: mrid
    hash_key: HK_CONNECTIVITY_NODE

  - name: hub_terminal
    source_table: terminals
    staging_model: stg_terminals
    business_key: mrid
    hash_key: HK_TERMINAL

# ── Satellites ────────────────────────────────────────────────────────────────
# Each satellite belongs to one hub (parent_hub) and tracks a specific attribute
# group.  Payload lists the raw descriptive columns to include.
satellites:
  - name: sat_conducting_equipment_details
    parent_hub: hub_conducting_equipment
    source_model: stg_conducting_equipment
    hash_key: HK_CONDUCTING_EQUIPMENT
    hashdiff: HASHDIFF_CE_DETAILS
    effective_from: EFFECTIVE_FROM
    payload:
      - name
      - equipment_type
      - base_voltage_kv
      - manufacturer
      - model
      - serial_number

  - name: sat_conducting_equipment_operational
    parent_hub: hub_conducting_equipment
    source_model: stg_conducting_equipment
    hash_key: HK_CONDUCTING_EQUIPMENT
    hashdiff: HASHDIFF_CE_OPERATIONAL
    effective_from: EFFECTIVE_FROM
    payload:
      - in_service
      - asset_status

  - name: sat_connectivity_node_details
    parent_hub: hub_connectivity_node
    source_model: stg_connectivity_nodes
    hash_key: HK_CONNECTIVITY_NODE
    hashdiff: HASHDIFF_CONNECTIVITY_NODE_DETAILS
    effective_from: EFFECTIVE_FROM
    payload:
      - name
      - description

  - name: sat_terminal_details
    parent_hub: hub_terminal
    source_model: stg_terminals
    hash_key: HK_TERMINAL
    hashdiff: HASHDIFF_TERMINAL_DETAILS
    effective_from: EFFECTIVE_FROM
    payload:
      - name
      - sequence_number
      - phases
      - connected

# ── Links ─────────────────────────────────────────────────────────────────────
# Links capture many-to-many relationships between hubs.
# fk_columns: ordered list of hub hash keys participating in the relationship.
links:
  - name: lnk_terminal_equipment_node
    source_model: stg_terminals
    hash_key: HK_TERMINAL_EQUIPMENT_NODE
    fk_columns:
      - HK_TERMINAL
      - HK_CONDUCTING_EQUIPMENT
      - HK_CONNECTIVITY_NODE

# ── Effectivity Satellites ────────────────────────────────────────────────────
# Effectivity satellites track the active/inactive lifecycle of link relationships
# using CDC flags (I/U/D).
eff_sats:
  - name: eff_sat_terminal_equipment_node
    parent_link: lnk_terminal_equipment_node
    source_model: stg_terminals
    hash_key: HK_TERMINAL_EQUIPMENT_NODE    # src_pk  — the link hash key
    driving_fk: HK_TERMINAL                 # src_dfk — the driving hub FK (terminal entity)
    secondary_fk:                           # src_sfk — remaining hub FKs in the link
      - HK_CONDUCTING_EQUIPMENT
      - HK_CONNECTIVITY_NODE
    effective_from: EFFECTIVE_FROM          # src_eff / src_start_date
    start_date: EFFECTIVE_FROM
    end_date: LOAD_DATE                     # src_end_date — closed by CDC deletion records

# ── Staging Models ────────────────────────────────────────────────────────────
# Staging models load and hash raw bronze data, producing the vault keys and
# hashdiffs consumed by all raw-vault models.
staging:
  - name: stg_conducting_equipment
    source_table: conducting_equipment
    derived_columns:
      RECORD_SOURCE: "record_source"
      LOAD_DATE:     "load_dts"
      EFFECTIVE_FROM: "load_dts"
      CDC_FLAG:      "cdc_flag"
    hashed_columns:
      HK_CONDUCTING_EQUIPMENT:
        - mrid
      HASHDIFF_CE_OPERATIONAL:
        is_hashdiff: true
        columns:
          - in_service
          - asset_status
      HASHDIFF_CE_DETAILS:
        is_hashdiff: true
        columns:
          - name
          - equipment_type
          - base_voltage_kv
          - manufacturer
          - model
          - serial_number
    ranked_columns:
      DBTVAULT_RANK:
        partition_by: mrid
        order_by: load_dts

  - name: stg_connectivity_nodes
    source_table: connectivity_nodes
    derived_columns:
      RECORD_SOURCE: "record_source"
      LOAD_DATE:     "load_dts"
      EFFECTIVE_FROM: "load_dts"
      CDC_FLAG:      "cdc_flag"
    hashed_columns:
      HK_CONNECTIVITY_NODE:
        - mrid
      HASHDIFF_CONNECTIVITY_NODE_DETAILS:
        is_hashdiff: true
        columns:
          - name
          - description
    ranked_columns:
      DBTVAULT_RANK:
        partition_by: mrid
        order_by: load_dts

  - name: stg_terminals
    source_table: terminals
    derived_columns:
      RECORD_SOURCE: "record_source"
      LOAD_DATE:     "load_dts"
      EFFECTIVE_FROM: "load_dts"
      CDC_FLAG:      "cdc_flag"
    hashed_columns:
      HK_TERMINAL:
        - mrid
      HK_CONDUCTING_EQUIPMENT:
        - conducting_equipment_mrid
      HK_CONNECTIVITY_NODE:
        - connectivity_node_mrid
      HK_TERMINAL_EQUIPMENT_NODE:
        - mrid
        - conducting_equipment_mrid
        - connectivity_node_mrid
      HASHDIFF_TERMINAL_DETAILS:
        is_hashdiff: true
        columns:
          - name
          - sequence_number
          - phases
          - connected
    ranked_columns:
      DBTVAULT_RANK:
        partition_by: mrid
        order_by: load_dts

# =============================================================================
# BUSINESS VAULT
# =============================================================================

# ── Point-in-Time Tables ──────────────────────────────────────────────────────
# PIT tables snapshot the load-date watermarks of every satellite for a hub,
# enabling efficient "as-of" joins without scanning full satellite history.
# Each satellite entry maps the PK/LDTS column aliases used by automate_dv.
pit_tables:
  - name: pit_conducting_equipment
    description: PIT snapshot for conducting equipment hub and its satellites
    hub: hub_conducting_equipment
    src_pk: HK_CONDUCTING_EQUIPMENT
    src_ldts: LOAD_DATE
    satellites:
      - name: sat_conducting_equipment_details
        pk:   HK_CONDUCTING_EQUIPMENT
        ldts: LOAD_DATE
      - name: sat_conducting_equipment_operational
        pk:   HK_CONDUCTING_EQUIPMENT
        ldts: LOAD_DATE

  - name: pit_connectivity_node
    description: PIT snapshot for connectivity node hub and its satellites
    hub: hub_connectivity_node
    src_pk: HK_CONNECTIVITY_NODE
    src_ldts: LOAD_DATE
    satellites:
      - name: sat_connectivity_node_details
        pk:   HK_CONNECTIVITY_NODE
        ldts: LOAD_DATE

  - name: pit_terminal
    description: PIT snapshot for terminal hub and its satellites
    hub: hub_terminal
    src_pk: HK_TERMINAL
    src_ldts: LOAD_DATE
    satellites:
      - name: sat_terminal_details
        pk:   HK_TERMINAL
        ldts: LOAD_DATE

# ── Bridge Tables ─────────────────────────────────────────────────────────────
# Bridge tables pre-join hubs and links (using effectivity satellites to filter
# active records), providing flat, easy-to-query structures for BI tools.
# bridge_walk: ordered list of link -> eff_sat traversals from the driving hub.
bridge_tables:
  - name: brg_terminal_equipment_connectivity
    description: >
      Bridge traversing terminals through their link to conducting equipment
      and connectivity nodes. Filters to active relationships via the
      effectivity satellite.
    hub: hub_terminal
    src_pk: HK_TERMINAL
    src_ldts: LOAD_DATE
    bridge_walk:
      - link:        lnk_terminal_equipment_node
        eff_sat:     eff_sat_terminal_equipment_node
        link_pk:     HK_TERMINAL_EQUIPMENT_NODE
        link_fk:     HK_TERMINAL              # driving FK (entry point)
    stage_tables:
      - stg_terminals

# ── Dimension Views (Star Schema) ─────────────────────────────────────────────
# Dimension views expose the current (latest) state of a hub entity by joining
# the hub with its PIT table and satellites. They provide business-friendly,
# denormalised rows for reporting and star-schema consumption.
# pit_table: references the pit_table built above; drives the "as-of" join.
dim_tables:
  - name: dim_conducting_equipment
    description: Current state of conducting equipment assets
    hub: hub_conducting_equipment
    src_pk: HK_CONDUCTING_EQUIPMENT
    business_key: mrid
    pit_table: pit_conducting_equipment
    satellites:
      - name: sat_conducting_equipment_details
        columns:
          - name
          - equipment_type
          - base_voltage_kv
          - manufacturer
          - model
          - serial_number
      - name: sat_conducting_equipment_operational
        columns:
          - in_service
          - asset_status

  - name: dim_connectivity_node
    description: Current state of connectivity nodes (busbars, junctions)
    hub: hub_connectivity_node
    src_pk: HK_CONNECTIVITY_NODE
    business_key: mrid
    pit_table: pit_connectivity_node
    satellites:
      - name: sat_connectivity_node_details
        columns:
          - name
          - description

  - name: dim_terminal
    description: Current state of terminals connecting equipment to nodes
    hub: hub_terminal
    src_pk: HK_TERMINAL
    business_key: mrid
    pit_table: pit_terminal
    satellites:
      - name: sat_terminal_details
        columns:
          - name
          - sequence_number
          - phases
          - connected

# ── Fact Views (Star Schema) ──────────────────────────────────────────────────
# Fact views join bridge tables with dimensions to produce reporting-ready
# star-schema structures. measures lists computed metrics; dimensions lists
# the dim_tables resolved via the bridge.
fact_tables:
  - name: fct_terminal_equipment_connectivity
    description: >
      Active connections between terminals, conducting equipment and
      connectivity nodes. Grain: one row per active terminal-equipment-node
      relationship.
    bridge_table: brg_terminal_equipment_connectivity
    grain: HK_TERMINAL_EQUIPMENT_NODE
    src_ldts: LOAD_DATE
    dimensions:
      - dim_terminal
      - dim_conducting_equipment
      - dim_connectivity_node
    measures: []                              # extend with kWh, capacity, etc.

# ── Business Vault Satellites ─────────────────────────────────────────────────
# BV satellites sit on top of raw-vault hubs and apply business rules:
# cleansing, derivation, classification, or type-2 slowly-changing attributes.
# They live in the business_vault schema and reference raw-vault sat models
# as their source.
bv_sats:
  - name: bv_sat_conducting_equipment_classification
    description: >
      Derived classification attributes for conducting equipment:
      voltage tier, asset lifecycle stage, and normalised equipment category.
    parent_hub: hub_conducting_equipment
    source_model: sat_conducting_equipment_details   # raw-vault sat as source
    hash_key: HK_CONDUCTING_EQUIPMENT
    hashdiff: HASHDIFF_BV_CE_CLASSIFICATION
    payload:
      - voltage_tier           # derived: 'HV' / 'MV' / 'LV' from base_voltage_kv
      - equipment_category     # normalised: 'TRANSFORMER' / 'SWITCH' / 'LINE' / etc.
      - lifecycle_stage        # derived: 'ACTIVE' / 'DECOMMISSIONED' / 'PLANNED'
