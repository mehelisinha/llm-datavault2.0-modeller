system:
  system_id: ADVWORKS_001
  system_name: AdventureWorks
  source_type: delta
  catalog: edh_unreg_consumption_dev
  schema: 2240_adventureworks
  load_frequency: daily
  record_source: ADVENTUREWORKS_v1
  record_source_column: RECORD_SOURCE
  default_ldts: LOAD_DATE
packages:
- package: dbt-labs/dbt_utils
  version: 1.3.3
- package: metaplane/dbt_expectations
  version: 0.10.10
- package: Datavault-UK/automate_dv
  version: 0.10.2
macros:
- name: generate_schema_name
  description: Generates the schema name by overwriting the AutomateDV default behavior.
hubs:
- name: hub_address
  source_table: address
  staging_model: stg_address
  business_key: AddressID
  hash_key: HK_ADDRESS
  databricks_config:
    materialized: incremental
    incremental_strategy: append
    on_schema_change: append_new_columns
    cluster_by:
    - HK_ADDRESS
    table_properties:
      delta.autoOptimize.optimizeWrite: true
      delta.autoOptimize.autoCompact: true
      delta.targetFileSize: 134217728
      delta.tuneFileSizesForRewrites: true
      delta.logRetentionDuration: interval 30 days
      delta.deletedFileRetentionDuration: interval 7 days
      delta.dataSkippingNumIndexedCols: 4
      delta.enableDeletionVectors: false
      delta.appendOnly: true
      delta.dataSkippingStatsColumns: HK_ADDRESS,LOAD_DATE
- name: hub_customer
  source_table: customer
  staging_model: stg_customer
  business_key: CustomerID
  hash_key: HK_CUSTOMER
  databricks_config:
    materialized: incremental
    incremental_strategy: append
    on_schema_change: append_new_columns
    cluster_by:
    - HK_CUSTOMER
    table_properties:
      delta.autoOptimize.optimizeWrite: true
      delta.autoOptimize.autoCompact: true
      delta.targetFileSize: 134217728
      delta.tuneFileSizesForRewrites: true
      delta.logRetentionDuration: interval 30 days
      delta.deletedFileRetentionDuration: interval 7 days
      delta.dataSkippingNumIndexedCols: 4
      delta.enableDeletionVectors: false
      delta.appendOnly: true
      delta.dataSkippingStatsColumns: HK_CUSTOMER,LOAD_DATE
- name: hub_product
  source_table: product
  staging_model: stg_product
  business_key: ProductID
  hash_key: HK_PRODUCT
  databricks_config:
    materialized: incremental
    incremental_strategy: append
    on_schema_change: append_new_columns
    cluster_by:
    - HK_PRODUCT
    table_properties:
      delta.autoOptimize.optimizeWrite: true
      delta.autoOptimize.autoCompact: true
      delta.targetFileSize: 134217728
      delta.tuneFileSizesForRewrites: true
      delta.logRetentionDuration: interval 30 days
      delta.deletedFileRetentionDuration: interval 7 days
      delta.dataSkippingNumIndexedCols: 4
      delta.enableDeletionVectors: false
      delta.appendOnly: true
      delta.dataSkippingStatsColumns: HK_PRODUCT,LOAD_DATE
satellites:
- name: sat_address_details
  description: Details attributes for hub_address (static change velocity).
  parent_hub: hub_address
  source_model: stg_address
  hash_key: HK_ADDRESS
  hashdiff: HD_ADDRESS_DETAILS
  effective_from: ModifiedDate
  payload:
  - AddressLine1
  - AddressLine2
  - City
  - StateProvince
  - CountryRegion
  - PostalCode
  - rowguid
  databricks_config:
    materialized: incremental
    incremental_strategy: append
