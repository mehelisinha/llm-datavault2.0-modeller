links:
- name: link_customer_address
  source_model: stg_customeraddress
  hash_key: HK_CUSTOMER_ADDRESS
  fk_columns:
  - HK_CUSTOMER
  - HK_ADDRESS
  databricks_config:
    materialized: incremental
    incremental_strategy: append
