  src_pk: HK_ADDRESS
  business_key: AddressID
  databricks_config:
    materialized: view
  satellites:
  - name: sat_address_details
    columns:
    - AddressLine1
    - AddressLine2
    - City
    - StateProvince
    - CountryRegion
    - PostalCode
    - rowguid
- name: dim_customer
  description: Current state of customer (hub + PIT + satellites).
  hub: hub_customer
  src_pk: HK_CUSTOMER
  business_key: CustomerID
  databricks_config:
