staging:
- name: stg_address
  source_table: address
  databricks_config:
    materialized: view
  derived_columns:
    RECORD_SOURCE: record_source
    LOAD_DATE: load_dts
    EFFECTIVE_FROM: load_dts
    CDC_FLAG: cdc_flag
    START_DATE: load_dts
    END_DATE: CASE WHEN cdc_flag = 'D' THEN CURRENT_TIMESTAMP ELSE CAST('9999-12-31'
      AS DATE) END
    IS_DELETED: CASE WHEN cdc_flag = 'D' THEN TRUE ELSE FALSE END
  hashed_columns:
    HK_ADDRESS:
    - AddressID
    HD_ADDRESS_DETAILS:
      is_hashdiff: true
      columns:
      - AddressLine1
      - AddressLine2
      - City
      - StateProvince
      - CountryRegion
      - PostalCode
      - rowguid
  ranked_columns:
    DBTVAULT_RANK:
      partition_by: AddressID
      order_by: load_dts
- name: stg_customer
  source_table: customer
  databricks_config:
    materialized: view
  derived_columns:
    RECORD_SOURCE: record_source
    LOAD_DATE: load_dts
    EFFECTIVE_FROM: load_dts
    CDC_FLAG: cdc_flag
    START_DATE: load_dts
    END_DATE: CASE WHEN cdc_flag = 'D' THEN CURRENT_TIMESTAMP ELSE CAST('9999-12-31'
      AS DATE) END
    IS_DELETED: CASE WHEN cdc_flag = 'D' THEN TRUE ELSE FALSE END
  hashed_columns:
    HK_CUSTOMER:
    - CustomerID
    HD_CUSTOMER_DETAILS:
      is_hashdiff: true
      columns:
      - NameStyle
      - Title
      - FirstName
      - MiddleName
      - LastName
      - Suffix
      - CompanyName
      - SalesPerson
      - EmailAddress
      - Phone
      - PasswordHash
      - PasswordSalt
      - rowguid
  ranked_columns:
    DBTVAULT_RANK:
      partition_by: CustomerID
      order_by: load_dts
- name: stg_customeraddress
  source_table: customeraddress
  databricks_config:
    materialized: view
  derived_columns:
    RECORD_SOURCE: record_source
    LOAD_DATE: load_dts
    EFFECTIVE_FROM: load_dts
    CDC_FLAG: cdc_flag
    START_DATE: load_dts
    END_DATE: CASE WHEN cdc_flag = 'D' THEN CURRENT_TIMESTAMP ELSE CAST('9999-12-31'
      AS DATE) END
    IS_DELETED: CASE WHEN cdc_flag = 'D' THEN TRUE ELSE FALSE END
  hashed_columns:
    HK_CUSTOMER:
    - CustomerID
    HK_ADDRESS:
    - AddressID
    HK_CUSTOMER_ADDRESS:
    - HK_CUSTOMER
    - HK_ADDRESS
- name: stg_product
  source_table: product
  databricks_config:
    materialized: view
  derived_columns:
    RECORD_SOURCE: record_source
    LOAD_DATE: load_dts
    EFFECTIVE_FROM: load_dts
    CDC_FLAG: cdc_flag
    START_DATE: load_dts
    END_DATE: CASE WHEN cdc_flag = 'D' THEN CURRENT_TIMESTAMP ELSE CAST('9999-12-31'
      AS DATE) END
    IS_DELETED: CASE WHEN cdc_flag = 'D' THEN TRUE ELSE FALSE END
  hashed_columns:
    HK_PRODUCT:
    - ProductID
    HD_PRODUCT_DETAILS:
      is_hashdiff: true
      columns:
      - Name
      - ProductNumber
      - Color
      - Size
      - ThumbNailPhoto
      - ThumbnailPhotoFileName
      - rowguid
    HD_PRODUCT_MEASUREMENTS:
      is_hashdiff: true
      columns:
      - StandardCost
      - ListPrice
      - Weight
    HD_PRODUCT_OPERATIONAL:
      is_hashdiff: true
      columns:
      - ProductCategoryID
      - ProductModelID
      - SellStartDate
      - SellEndDate
      - DiscontinuedDate
  ranked_columns:
    DBTVAULT_RANK:
      partition_by: ProductID
      order_by: load_dts
dim_tables:
- name: dim_address
