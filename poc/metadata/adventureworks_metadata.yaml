    - DiscontinuedDate
databricks_optimization:
  default_file_size: 134217728
  log_retention: interval 30 days
  deleted_file_retention: interval 7 days
  auto_optimize:
    optimize_write: true
    auto_compact: true
  liquid_clustering:
    enabled: true
    preferred_over_zorder: true
  skipping_indexed_cols: 8
  incremental_strategy_defaults:
    hub: append
    satellite_raw: append
    satellite_bv: append
    link: append
    eff_sat: merge
    pit: insert_overwrite
    bridge: table
    staging: view
    as_of_dates: view
    dim: view
    fact: view
