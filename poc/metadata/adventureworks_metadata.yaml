eff_sats:
- name: eff_sat_link_customer_address
  parent_link: link_customer_address
  source_model: stg_customeraddress
  hash_key: HK_CUSTOMER_ADDRESS
  driving_fk: HK_CUSTOMER
  secondary_fk:
  - HK_ADDRESS
  effective_from: EFFECTIVE_FROM
  start_date: START_DATE
  end_date: END_DATE
  databricks_config:
    materialized: incremental
    incremental_strategy: merge
    unique_key: HK_CUSTOMER_ADDRESS
    on_schema_change: append_new_columns
    cluster_by:
    - HK_CUSTOMER_ADDRESS
    - END_DATE
    table_properties:
      delta.autoOptimize.optimizeWrite: true
      delta.autoOptimize.autoCompact: true
