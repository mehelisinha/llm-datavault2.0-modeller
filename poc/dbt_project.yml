name: iec_dv2
version: '1.0.0'
config-version: 2

profile: iec_dv2_databricks

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["data/seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

# ── Global variable defaults ──────────────────────────────────────────────────
vars:
  load_date: "{{ run_started_at.strftime('%Y-%m-%d') }}"
  # Override record_source per environment if needed
  record_source: "IEC61968_CIM"

# ── Model configs by layer ────────────────────────────────────────────────────
models:
  iec_dv2:

    # Staging — hashing, aliasing, preparing for raw vault
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]

    # Raw Vault
    raw_vault:
      +schema: raw_vault
      +tags: ["raw_vault"]

      hubs:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: "hk_{{ this.name }}"

      links:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: "hk_{{ this.name }}"

      satellites:
        +materialized: incremental
        +incremental_strategy: merge
        +unique_key: ["hk_{{ this.name }}", "load_dts"]

    # Business Vault — derived, pit, bridge
    business_vault:
      +schema: business_vault
      +materialized: table
      +tags: ["business_vault"]
