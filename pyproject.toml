[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwa-dv-generator"
version = "0.1.0"
description = "Data Vault v2 model generator for dbt projects"
authors = [
    {name = "Contributor", email = "contributor@example.com"}
]
requires-python = ">=3.12"

dependencies = [
    # ── templating ─────────────────────────────
    "pyyaml>=6.0",
    "jinja2>=3.1",

    # ── dbt ────────────────────────────────────
    "dbt-core~=1.11.0",
    "dbt-databricks~=1.11.0",

    # ── dagster ───────────────────────────────
    "dagster-dbt~=0.28.0",
    "dagster-webserver~=1.12.0",

    # ── validation ─────────────────────────────
    "pydantic>=2.7,<3",

    # ── utilities ──────────────────────────────
    "pandas>=2.2,<4",

    # -- docs ──────────────────────────────
    "mistune",
    "markdown",
    # ── Databricks ──────────────────────────────
    "databricks-connect~=15.4.3",
]

[project.scripts]
generate-dv-models = "dwa_dv_generator.cli:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "build",
    "twine",

]

# ── AI layer (Phase 0+) ────────────────────────────
# Note: azure-ai-projects / azure-ai-inference / azure-ai-evaluation are still
# in pre-release as of May 2026; allow betas for those. The Phase 0 smoke test
# uses only the openai SDK + azure-search-documents + azure-identity.
ai = [
    "azure-ai-projects>=1.0.0b1",
    "azure-ai-inference>=1.0.0b9",
    "azure-ai-evaluation>=1.0.0b1",
    "azure-search-documents>=11.5.0",
    "azure-identity>=1.17.0",
    "azure-monitor-opentelemetry>=1.6.0",
    "openai>=1.40.0",
    "pydantic-settings>=2.5.0",
    "ruamel.yaml>=0.18.0",
    "openpyxl>=3.1.0",
    "tenacity>=9.0.0",
    # Phase 2: local vector backend (CPU build, no GPU dep, ~18 MB).
    "faiss-cpu>=1.8.0",
    "numpy>=1.26",
    # Phase B: HTTP service surface backing the React UI.
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    # Phase C: ADLS Gen2 metadata store for approved YAMLs.
    "azure-storage-file-datalake>=12.0",
]

# ── Package data ────────────────────────────────────
# Ship the agent rule-prompt files (*.md) inside the wheel so the prompt loader
# resolves them after an installed (non-source) deploy. Source runs (pnpm dev)
# read them straight from the tree regardless.
[tool.setuptools.package-data]
"dbt_builder.src.ai.prompts" = ["*.md"]

# ── Foramt and Linting ─────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Databricks notebook tasks use the `# COMMAND ----------` cell convention,
# which legitimately interleaves imports with code (E402) and relies on names
# injected by the Databricks runtime such as ``spark``, ``dbutils`` and
# ``root_path`` (F821). Bare value-display expressions are also normal in
# notebook cells (B018).
"dbt_builder/src/tasks/*.py" = ["E402", "F821", "B018"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

